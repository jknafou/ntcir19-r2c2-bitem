[project]
name = "bitem-agentic-rag-r2c2"
version = "0.1.0"
description = "Agentic RAG inference pipeline + corpus indexation toolkit for the NTCIR-19 R2C2 shared task"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Julien Knafou", email = "julien.knafou@hes-so.ch" },
]
keywords = [
    "rag",
    "agentic-rag",
    "retrieval-augmented-generation",
    "ntcir",
    "r2c2",
    "mcp",
    "tool-calling",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# One environment serves every phase (chunk / NER / KG / ES / FAISS / agent).
# vLLM and the CUDA stack are ordinary dependencies, so a plain `uv sync` on a
# fresh clone yields a working GPU env without a second venv. The exact
# submission stack is locked by [tool.uv] constraint/override-dependencies below.
dependencies = [
    # Agentic loop + MCP plumbing
    "httpx==0.28.1",
    "mcp==1.27.0",
    "openai==2.24.0",
    "aiohttp==3.13.3",
    "pydantic==2.12.3",
    # NLI verifier cascade (MiniCheck-Flan-T5-Large, ModernCE, DeBERTa-MNLI)
    "sentence-transformers==5.3.0",
    "numpy==2.2.6",
    # Indexation: Elasticsearch BM25 + FAISS dense
    "elasticsearch==8.19.3",
    "faiss-cpu==1.13.2",
    # Custom modeling files in some HF checkpoints require einops at load time
    "einops==0.8.2",
    # Knowledge-graph build (NER dictionary helper)
    "pyahocorasick>=2.0",
    # GPU / inference stack (validated submission env, py3.12 + CUDA 12.9).
    # Every inference phase imports vLLM from this venv. transformers is pinned to
    # 5.5.4 via [tool.uv] override-dependencies (vLLM pins transformers<5, but
    # 5.5.4 is required to load Qwen3.5-9B).
    "vllm==0.17.1",
    "transformers==5.5.4",
    "torch==2.10.0+cu129",
    "torchvision==0.25.0+cu129",
    "torchaudio==2.10.0+cu129",
    "fla-core==0.4.2",
    "flash-linear-attention==0.4.2",
    "flashinfer-python==0.6.4",
    "tokenizers==0.22.2",
    "accelerate==1.11.0",
    # ninja: flashinfer JIT shells out to it for the gated-delta-net build.
    # Pinned here so it lands on the venv bin/ (SLURM scripts put that on PATH).
    "ninja==1.13.0",
    # llamafactory: part of the canonical submission closure (training-only);
    # pinned to the exact commit for an identical environment.
    "llamafactory",
]

[project.optional-dependencies]
# (none — the single default env covers all phases)

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest-asyncio>=1.3.0",
]

# uv configuration — reproduces the exact validated submission stack so a plain
# `uv lock && uv sync` (no manual --no-deps / --index-strategy flags) rebuilds
# the same env that ran the NTCIR-19 R2C2 submission (vLLM 0.17.1 /
# torch 2.10.0+cu129 / transformers 5.5.4 / CUDA 12.9) on CPython 3.12.
[tool.uv]
# vLLM 0.17.1 declares transformers<5, but 5.5.4 is required to load Qwen3.5-9B.
# override-dependencies replaces that constraint so the resolver
# accepts 5.5.4 instead of rejecting the graph.
override-dependencies = ["transformers==5.5.4"]
# The cu129 PyTorch index also carries common packages at older versions; let
# uv pick the best version across PyPI + the cu129 index (the +cu129 local
# pins still force the correct torch build).
index-strategy = "unsafe-best-match"
# Flat closure of the validated env: every transitive package pinned to the
# exact submission version. Locks transitive resolution to the byte-exact set
# without forcing every package into [project.dependencies].
constraint-dependencies = [
