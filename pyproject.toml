[tool.uv.sources]
# +cu129 torch wheels live only on the PyTorch CUDA 12.9 index (not PyPI).
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
# Pinned training-framework commit, part of the canonical closure.
llamafactory = { git = "https://github.com/hiyouga/LLaMA-Factory.git", rev = "fa09c01c363e532f4c2143d815aca2e58439addb" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2c2_agent", "src/r2c2_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
